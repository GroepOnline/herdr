name: RPA bisect call7

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-v1:
    name: Call pd-v1
    uses: ./.github/workflows/pd-v1.yml
    with:
      tag: v0.8.0
      dry_run: true
