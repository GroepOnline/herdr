name: Release portable assets

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: release-portable-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve stable release
    # For workflow_run, require the triggering Release run to originate from this
    # repository (not a fork). This gates the whole pipeline (every job needs
    # prepare) and prevents cache poisoning from an untrusted head checkout.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: release
        name: Validate tag and release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$(git tag --points-at "$RELEASE_WORKFLOW_SHA" --list 'v[0-9]*' | sort -V | tail -n 1)"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not resolve a stable vX.Y.Z tag (got: ${TAG:-empty})" >&2
            exit 1
          fi

          SHA="$(git rev-list -n 1 "$TAG")"
          VERSION="${TAG#v}"
          CARGO_VERSION="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "error: tag $TAG does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig on Linux
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install build tools on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools libdbus-1-dev pkg-config

          # A glibc aarch64 cross-compiler can compile the Rust target but emits
          # glibc-only symbols in native dependencies such as aws-lc-sys. Route
          # both Cargo's final link and target C/C++ build scripts through Zig's
          # real aarch64-musl toolchain instead. cc-rs also forwards Rust's
          # `aarch64-unknown-linux-musl` triple, which Zig does not understand;
          # the wrappers remove that duplicate and use Zig's equivalent triple.
          #
          # zig cc always injects its own musl crt1.o and honours neither
          # -nostartfiles nor -nostdlib to suppress it, so Rust's self-contained
          # CRT plus Zig's CRT produce a duplicate `_start` at link time. Rather
          # than fight Zig in the wrapper, disable Rust's self-contained linking
          # for this target (RUSTFLAGS below) so Zig alone owns the CRT, libc,
          # and libunwind.
          toolchain="$RUNNER_TEMP/aarch64-linux-musl-toolchain"
          mkdir -p "$toolchain"
          cat > "$toolchain/cc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=aarch64-unknown-linux-musl) ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target aarch64-linux-musl "${args[@]}"
          EOF
          cat > "$toolchain/cxx" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=aarch64-unknown-linux-musl) ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig c++ -target aarch64-linux-musl "${args[@]}"
          EOF
          cat > "$toolchain/ar" <<'EOF'
          #!/bin/sh
          exec zig ar "$@"
          EOF
          cat > "$toolchain/ranlib" <<'EOF'
          #!/bin/sh
          exec zig ranlib "$@"
          EOF
          chmod +x "$toolchain/cc" "$toolchain/cxx" "$toolchain/ar" "$toolchain/ranlib"

          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$toolchain/cc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C link-self-contained=no"
            echo "CC_aarch64_unknown_linux_musl=$toolchain/cc"
            echo "CXX_aarch64_unknown_linux_musl=$toolchain/cxx"
            echo "AR_aarch64_unknown_linux_musl=$toolchain/ar"
            echo "RANLIB_aarch64_unknown_linux_musl=$toolchain/ranlib"
          } >> "$GITHUB_ENV"

      - name: Install build tools on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15 cmake ninja
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: stable-portable-${{ matrix.target }}

      - name: Build release binary
        run: |
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/herdr" "${{ matrix.name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  publish:
    name: Publish portable assets
    needs: [prepare, build]
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: built-assets

      - name: Collect release assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp built-assets/herdr-linux-aarch64/herdr-linux-aarch64 release-assets/
          cp built-assets/herdr-macos-x86_64/herdr-macos-x86_64 release-assets/
          cp built-assets/herdr-macos-aarch64/herdr-macos-aarch64 release-assets/
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern herdr-linux-x86_64 --dir release-assets

          for asset in \
            herdr-linux-x86_64 \
            herdr-linux-aarch64 \
            herdr-macos-x86_64 \
            herdr-macos-aarch64; do
            test -s "release-assets/$asset"
            chmod +x "release-assets/$asset"
          done

          (
            cd release-assets
            sha256sum \
              herdr-linux-x86_64 \
              herdr-linux-aarch64 \
              herdr-macos-x86_64 \
              herdr-macos-aarch64 > SHA256SUMS
          )

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release-assets/herdr-linux-aarch64 \
            release-assets/herdr-macos-x86_64 \
            release-assets/herdr-macos-aarch64 \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  update-manifest:
    name: Atomically promote stable manifest
    needs: [prepare, publish]
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Download and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'herdr-linux-x86_64' \
            --pattern 'herdr-linux-aarch64' \
            --pattern 'herdr-macos-x86_64' \
            --pattern 'herdr-macos-aarch64' \
            --pattern 'SHA256SUMS' \
            --dir release-assets

          expected=(
            herdr-linux-x86_64
            herdr-linux-aarch64
            herdr-macos-x86_64
            herdr-macos-aarch64
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
            grep -Eq "^[a-fA-F0-9]{64}[[:space:]]+\\*?${asset}$" release-assets/SHA256SUMS
          done
          test "$(grep -Ec '^[a-fA-F0-9]{64}[[:space:]]+\*?herdr-' release-assets/SHA256SUMS)" -eq 4
          (cd release-assets && sha256sum --check --strict SHA256SUMS)

      - name: Promote complete release into latest.json
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ANNOUNCEMENT_PATH="$RUNNER_TEMP/product-announcement.json"
          ANNOUNCEMENT_ORIGINAL_PATH="$RUNNER_TEMP/product-announcement-original.json"
          git show "${TAG}:docs/next/product-announcement.json" > "$ANNOUNCEMENT_PATH"
          cp "$ANNOUNCEMENT_PATH" "$ANNOUNCEMENT_ORIGINAL_PATH"
          python3 scripts/changelog.py validate-product-announcement --path "$ANNOUNCEMENT_PATH"
          RELEASE_PROTOCOL="$(
            git show "${TAG}:src/protocol/wire.rs" |
              python3 -c 'import re, sys; match = re.search(r"pub const PROTOCOL_VERSION: u32 = (\d+);", sys.stdin.read()); sys.exit(1) if match is None else print(match.group(1))'
          )"

          python3 scripts/changelog.py sync-latest-json \
            --version "$VERSION" \
            --output website/latest.json \
            --announcement "$ANNOUNCEMENT_PATH" \
            --protocol "$RELEASE_PROTOCOL" \
            --checksums release-assets/SHA256SUMS \
            --allow-current-version

          if ! cmp -s "$ANNOUNCEMENT_ORIGINAL_PATH" "$ANNOUNCEMENT_PATH" &&
             cmp -s "$ANNOUNCEMENT_ORIGINAL_PATH" docs/next/product-announcement.json; then
            printf 'null\n' > docs/next/product-announcement.json
          fi

          python3 scripts/ci_quality.py check-latest-json-manifest
          python3 scripts/homebrew_formula.py \
            --version "$VERSION" \
            --checksums release-assets/SHA256SUMS \
            --output packaging/homebrew/groeponline-herdr.rb
          ruby -c packaging/homebrew/groeponline-herdr.rb

      - name: Commit stable manifest and formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/latest.json docs/next/product-announcement.json packaging/homebrew/groeponline-herdr.rb
          git diff --cached --quiet || git commit -m "docs: atomically promote v$VERSION"
          git push origin main

      - name: Verify live manifest (domain health)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          live_url="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import product_config; print(product_config.DEFAULT_LIVE_MANIFEST_URL)')"
          echo "Verifying live manifest at $live_url"
          ok=0
          for i in $(seq 1 20); do
            body="$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 20 "$live_url" 2>/dev/null || true)"
            if [ -n "$body" ] && echo "$body" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
              live_version="$(echo "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
              if [ "$live_version" = "$VERSION" ]; then
                echo "Live manifest version $live_version matches release $VERSION"
                ok=1
                break
              fi
              echo "poll $i: live version=$live_version, expected $VERSION"
            else
              echo "poll $i: $live_url not reachable or invalid JSON"
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "error: live manifest $live_url did not serve version $VERSION within the retry window" >&2
            exit 1
          fi

      - name: Trigger website deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK not set; relying on Cloudflare git auto-deploy"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Triggered Cloudflare Pages production deploy"

  publish-distribution:
    name: Publish npm and Homebrew
    needs: [prepare, update-manifest]
    # publish-distribution.yml requests id-token: write for npm provenance.
    # A reusable workflow cannot elevate permissions above what the caller
    # grants, so grant id-token: write here explicitly. Without this the
    # whole workflow fails at startup with a "workflow file issue".
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-distribution.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: false
    secrets: inherit
