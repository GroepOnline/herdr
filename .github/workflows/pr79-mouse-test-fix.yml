name: PR 79 mouse test correction

on:
  push:
    branches:
      - freebuff/changes-fx8b6gcy
    paths:
      - .github/workflows/pr79-mouse-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: freebuff/changes-fx8b6gcy
          fetch-depth: 0

      - name: Align mouse test expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/input/mouse.rs')
          text = path.read_text()

          old = '''    fn new_shell_new_tab_click_requests_new_tab() {
        let mut app = app_for_new_shell_test();
        let layout = app.new_shell_layout.clone().unwrap();
'''
          new = '''    fn new_shell_new_tab_click_requests_new_tab() {
        let mut app = app_for_new_shell_test();
        app.prompt_new_tab_name = false;
        let layout = app.new_shell_layout.clone().unwrap();
'''
          if text.count(old) != 1:
              raise SystemExit(f'new-tab test anchor count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''        assert!(result.is_none());
        assert_eq!(app.mode, Mode::Terminal);
    }
}'''
          new = '''        assert!(result.is_none());
        assert_eq!(app.mode, Mode::Navigate);
    }
}'''
          if text.count(old) != 1:
              raise SystemExit(f'dead-space test anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all

      - name: Remove temporary files and push
        run: |
          git config user.name OnlineChef
          git config user.email chefadmin@chefgroep.online
          git rm .github/workflows/pr79-mouse-test-fix.yml
          git rm -f src/ui/pr79_ci_trigger.rs || true
          git add src/app/input/mouse.rs
          git commit -m "test(ui): align new-shell mouse expectations"
          git push origin HEAD:freebuff/changes-fx8b6gcy
