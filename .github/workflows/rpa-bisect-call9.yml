name: RPA bisect call9

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-v3:
    name: Call pd-v3
    uses: ./.github/workflows/pd-v3.yml
    with:
      tag: v0.8.0
      dry_run: true
