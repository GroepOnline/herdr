name: Prepare v0.7.7 release commit

on:
  push:
    branches:
      - release/v0.7.7
    paths:
      - scripts/apply_release_0_7_7.py
      - .github/workflows/apply-release-0-7-7.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_VERSION: 0.15.2

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: release/v0.7.7
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          python3 scripts/apply_release_0_7_7.py
          cargo update -p herdr
          python3 scripts/ci_quality.py sync-release-metadata

      - name: Validate release candidate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked checksum
          python3 -m unittest \
            scripts.test_changelog \
            scripts.test_ci_quality \
            scripts.test_homebrew_formula \
            scripts.test_install_sh \
            scripts.test_release_manifest_hardening
          python3 scripts/ci_quality.py check-release-metadata
          python3 scripts/ci_quality.py check-product-urls
          python3 scripts/changelog.py extract --version 0.7.7 --output /tmp/herdr-v0.7.7-notes.md
          test -s /tmp/herdr-v0.7.7-notes.md
          git diff --check

      - name: Commit validated release candidate
        run: |
          set -euo pipefail
          git rm -f \
            scripts/apply_release_0_7_7.py \
            .github/workflows/apply-release-0-7-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/next/CHANGELOG.md \
            Cargo.toml \
            Cargo.lock \
            npm/package.json \
            scripts/ci_quality.py \
            scripts/test_ci_quality.py
          git diff --cached --check
          git commit -m "release: v0.7.7"
          git push origin HEAD:release/v0.7.7
