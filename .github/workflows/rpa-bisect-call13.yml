      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-v7:
    name: Call pd-v7
    uses: ./.github/workflows/pd-v7.yml
    with:
      tag: v0.8.0
      dry_run: true
