name: Apply required Rust checksums

on:
  push:
    branches:
      - dist/harden-release-chain
    paths:
      - scripts/apply_required_rust_checksums.py
      - .github/workflows/apply-required-rust-checksums.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_VERSION: 0.15.2

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dist/harden-release-chain
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Apply checksum patch
        run: python3 scripts/apply_required_rust_checksums.py

      - name: Format and compile all Rust tests
        run: |
          cargo fmt --all
          cargo test --locked --no-run

      - name: Run checksum-focused tests
        run: |
          cargo test --locked checksum
          cargo test --locked asset_requires_valid_sha256
          cargo test --locked asset_rejects_legacy_url_string

      - name: Commit validated Rust patch
        run: |
          set -euo pipefail
          git rm \
            scripts/apply_required_rust_checksums.py \
            .github/workflows/apply-required-rust-checksums.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/checksum.rs src/update.rs src/remote/unix.rs
          git diff --cached --check
          git commit -m "security: require checksums for Rust-managed downloads"
          git push origin HEAD:dist/harden-release-chain
