name: RPA bisect call14

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  call-v6:
    name: Call pd-v6
    uses: ./.github/workflows/pd-v6.yml
    with:
      tag: v0.8.0
      dry_run: true
