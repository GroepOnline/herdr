name: RPA bisect call2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: rpa-call2-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve stable release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - id: release
        name: Validate tag and release version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=abc" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  publish-distribution:
    name: Publish npm and Homebrew
    needs: [prepare]
    uses: ./.github/workflows/publish-distribution.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: true
