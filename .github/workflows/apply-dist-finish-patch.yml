name: Apply final distribution hardening patch

on:
  push:
    branches:
      - dist/harden-release-chain
    paths:
      - scripts/apply_dist_finish_patch.py
      - .github/workflows/apply-dist-finish-patch.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dist/harden-release-chain
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4
        with:
          node-version: "22"

      - name: Apply deterministic checkout patch
        run: python3 scripts/apply_dist_finish_patch.py

      - name: Validate distribution tooling
        run: |
          set -euo pipefail
          sh -n website/install.sh
          node --check npm/install.js
          node --check npm/bin/herdr.js
          ruby -c packaging/homebrew/onlinechefgroep-herdr.rb
          python3 -m unittest \
            scripts.test_changelog \
            scripts.test_ci_changed_paths \
            scripts.test_ci_quality \
            scripts.test_homebrew_formula \
            scripts.test_install_sh \
            scripts.test_release_manifest_hardening
          python3 scripts/ci_quality.py check-release-metadata
          python3 scripts/ci_quality.py check-product-urls
          (cd npm && npm pack --dry-run --ignore-scripts)

      - name: Validate workflow and documentation diffs
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'python3 scripts/homebrew_formula.py' .github/workflows/release-portable-assets.yml
          ! grep -F 'diff -u packaging/homebrew/onlinechefgroep-herdr.rb' .github/workflows/publish-distribution.yml
          grep -F 'python3 -m unittest scripts.test_install_sh' .github/workflows/ci.yml
          grep -F 'npm install --global onlinechefgroep-herdr@latest' README.md
          grep -F 'SHA-256' website/src/content/docs/install.mdx

      - name: Commit validated finish patch
        run: |
          set -euo pipefail
          git rm \
            scripts/apply_dist_finish_patch.py \
            .github/workflows/apply-dist-finish-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "dist: finish verified multi-channel release hardening"
          git push origin HEAD:dist/harden-release-chain
