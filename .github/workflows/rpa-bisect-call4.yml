name: RPA bisect call4

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: rpa-call4-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-distribution:
    name: Publish npm and Homebrew
    uses: ./.github/workflows/publish-distribution.yml
    with:
      tag: v0.8.0
      dry_run: true
