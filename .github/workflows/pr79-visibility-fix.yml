name: PR 79 test visibility fix

on:
  push:
    branches:
      - freebuff/changes-fx8b6gcy
    paths:
      - .github/workflows/pr79-visibility-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: freebuff/changes-fx8b6gcy
          fetch-depth: 0

      - name: Expose new tab module to crate tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui.rs')
          text = path.read_text()
          old = '#[allow(dead_code)]\nmod tabs_new;'
          new = '#[allow(dead_code)]\npub(crate) mod tabs_new;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one tabs_new declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all

      - name: Remove temporary files and push
        run: |
          git config user.name OnlineChef
          git config user.email chefadmin@chefgroep.online
          git rm .github/workflows/pr79-visibility-fix.yml
          git rm -f src/ui/pr79_ci_trigger.rs || true
          git add src/ui.rs
          git commit -m "fix(ui): expose new tab layout within crate"
          git push origin HEAD:freebuff/changes-fx8b6gcy
