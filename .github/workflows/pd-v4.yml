name: PD v4

on:
  workflow_call:
    inputs:
      tag:
        description: tag
        required: true
        type: string
      dry_run:
        description: dry
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
      HOMEBREW_TAP_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: tag
        required: true
        type: string
      dry_run:
        description: dry
        required: true
        default: true
        type: boolean

concurrency:
  group: distribution-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello ${{ inputs.tag }}"
      - name: skip when dry
        if: ${{ !inputs.dry_run }}
        run: echo "not dry"
