name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: read-only. Uses `pull_request` (not
# `pull_request_target`), so fork PRs run the fork's code WITHOUT access to repo
# secrets. Because these lanes run on GitHub-hosted `ubuntu-latest`, also set
# Settings -> Actions -> General -> "Fork pull request workflows from outside
# collaborators" to "Require approval" so forks cannot spend runner minutes or
# probe the workflow without maintainer approval. That is a repo setting and
# cannot be enforced from this file.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_VERSION: 0.15.2
  BUN_VERSION: 1.3.14

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      maintenance: ${{ steps.filter.outputs.maintenance }}
      release_meta: ${{ steps.filter.outputs.release_meta }}
      platform_heavy: ${{ steps.filter.outputs.platform_heavy }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Classify changed paths
        run: python3 scripts/ci_changed_paths.py

  format:
    name: Format
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt

      - name: Formatting
        run: cargo fmt --all -- --check

  check:
    name: Check
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Link with mold on this lane only; the apt step below installs it. Scoped
    # per-job so lanes that never install mold (release-smoke, windows-lint)
    # keep the default linker.
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config mold

      - name: Cargo check
        run: cargo check --all-targets --locked

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Link with mold on this lane only; the apt step below installs it. Scoped
    # per-job so lanes that never install mold (release-smoke, windows-lint)
    # keep the default linker.
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config mold

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Link with mold on this lane only; the apt step below installs it. Scoped
    # per-job so lanes that never install mold (release-smoke, windows-lint)
    # keep the default linker.
    env:
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Rust tools
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-nextest

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config mold

      - name: Cargo nextest
        run: cargo nextest run --locked --status-level fail --final-status-level fail --failure-output final --success-output never

  maintenance-python:
    name: Maintenance (python)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.maintenance == 'true' || needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Python maintenance unittests
        run: python3 -m unittest scripts.test_agent_detection_manifest_check scripts.test_changelog scripts.test_ci_changed_paths scripts.test_ci_quality scripts.test_config_reference_check scripts.test_dev scripts.test_homebrew_formula scripts.test_install_sh scripts.test_preview scripts.test_product_urls scripts.test_release_manifest_hardening scripts.test_release_portable_assets_workflow scripts.test_vendor_libghostty_vt scripts.test_vendor_portable_pty

  maintenance-assets:
    name: Maintenance (integration assets)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.maintenance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Integration asset tests
        run: |
          bun test src/integration/assets/herdr-agent-state.test.ts
          bun test src/integration/assets/opencode/herdr-agent-state.test.ts

  maintenance-plugins:
    name: Maintenance (plugin marketplace)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.maintenance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Plugin marketplace tests
        run: cd workers/plugin-marketplace && bun install --frozen-lockfile && bun test

  windows-lint:
    name: Windows lint
    needs: changes
    # Heavy: native windows clippy. PR docs-only skips; force with label ci-heavy.
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.platform_heavy == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ci-heavy')
    # BILLING_QUARANTINE: was windows-latest — disabled until spending restored
    if: false
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LIBGHOSTTY_VT_SIMD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-windows-lint-native

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          # Restored Windows Zig caches have produced missing generated files.
          # Keep this lane deterministic; Rust's Cargo cache remains enabled.
          use-cache: false

      - name: Remove Zig build outputs
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Cargo clippy on Windows
        shell: bash
        run: cargo clippy --bin herdr --locked -- -D warnings

  release-metadata:
    name: Release metadata
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.release_meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Release metadata consistency
        run: |
          python3 scripts/changelog.py validate-product-announcement
          node --check npm/install.js
          node --check npm/bin/herdr.js
          sh -n website/install.sh
          python3 -m unittest scripts.test_install_sh
          (cd npm && npm pack --dry-run --ignore-scripts)
          python3 scripts/ci_quality.py check-release-metadata

  release-smoke:
    name: Release smoke build (${{ matrix.target }})
    needs: [changes, format, clippy, test]
    if: >
      always() &&
      (needs.format.result == 'success' || needs.format.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        needs.changes.outputs.platform_heavy == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'ci-heavy')
      )
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: herdr-linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-release-smoke-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      # Non-LTO release-profile smoke build; not the exact publish artifact.
      - name: Build release smoke artifact (LTO off)
        run: cargo build --release --locked --target ${{ matrix.target }} --config profile.release.lto=false

      - name: Stage smoke artifact
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.artifact }}

      - name: Upload smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-smoke-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - format
      - check
      - clippy
      - test
      - maintenance-python
      - maintenance-assets
      - maintenance-plugins
      - windows-lint
      - release-metadata
      - release-smoke
    if: always()
    steps:
      - name: Require quality jobs (skipped heavy lanes OK)
        run: |
          set -euo pipefail
          require_ok() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *)
                echo "Quality gate failed; $name result was: $result"
                exit 1
                ;;
            esac
          }
          require_ok changes "${{ needs.changes.result }}"
          require_ok format "${{ needs.format.result }}"
          require_ok check "${{ needs.check.result }}"
          require_ok clippy "${{ needs.clippy.result }}"
          require_ok test "${{ needs.test.result }}"
          require_ok maintenance-python "${{ needs.maintenance-python.result }}"
          require_ok maintenance-assets "${{ needs.maintenance-assets.result }}"
          require_ok maintenance-plugins "${{ needs.maintenance-plugins.result }}"
          require_ok windows-lint "${{ needs.windows-lint.result }}"
          require_ok release-metadata "${{ needs.release-metadata.result }}"
          require_ok release-smoke "${{ needs.release-smoke.result }}"
          echo "Quality gate passed."
