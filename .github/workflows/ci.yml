name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_VERSION: 0.15.2
  BUN_VERSION: 1.3.14

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      maintenance: ${{ steps.filter.outputs.maintenance }}
      release_meta: ${{ steps.filter.outputs.release_meta }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Classify changed paths
        run: python3 scripts/ci_changed_paths.py

  lint:
    name: Lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cargo nextest
        run: cargo nextest run --locked --status-level fail --final-status-level fail --failure-output final --success-output never

  maintenance:
    name: Maintenance
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.maintenance == 'true' || needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Python maintenance unittests
        run: python3 -m unittest scripts.test_agent_detection_manifest_check scripts.test_changelog scripts.test_ci_changed_paths scripts.test_ci_quality scripts.test_config_reference_check scripts.test_dev scripts.test_docs_translation_parity scripts.test_preview scripts.test_vendor_libghostty_vt scripts.test_vendor_portable_pty

      - name: Integration asset tests
        run: |
          bun test src/integration/assets/herdr-agent-state.test.ts
          bun test src/integration/assets/opencode/herdr-agent-state.test.ts

      - name: Plugin marketplace tests
        run: cd workers/plugin-marketplace && bun test

  release-metadata:
    name: Release metadata
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.release_meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Release metadata consistency
        run: |
          python3 scripts/changelog.py validate-product-announcement
          node --check npm/install.js
          node --check npm/bin/herdr.js
          (cd npm && npm pack --dry-run --ignore-scripts)
          python3 scripts/ci_quality.py check-release-metadata

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - test
      - maintenance
      - release-metadata
    if: always()
    steps:
      - name: Require Linux quality jobs (heavy lanes run in CI heavy)
        run: |
          set -euo pipefail
          require_ok() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) echo "$name: $result" ;;
              *)
                echo "Quality gate failed; $name result was: $result"
                exit 1
                ;;
            esac
          }
          require_ok changes "${{ needs.changes.result }}"
          require_ok lint "${{ needs.lint.result }}"
          require_ok test "${{ needs.test.result }}"
          require_ok maintenance "${{ needs.maintenance.result }}"
          require_ok release-metadata "${{ needs.release-metadata.result }}"
          echo "Quality gate passed."
