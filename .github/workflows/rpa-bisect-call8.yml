name: RPA bisect call8

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to backfill, for example v0.7.6
        required: true
        type: string

permissions:
  contents: read

jobs:
  call-v2:
    name: Call pd-v2
    uses: ./.github/workflows/pd-v2.yml
    with:
      tag: v0.8.0
      dry_run: true
