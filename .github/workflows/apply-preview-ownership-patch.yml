name: Apply downstream preview ownership

on:
  push:
    branches:
      - dist/harden-release-chain
    paths:
      - scripts/apply_preview_ownership_patch.py
      - .github/workflows/apply-preview-ownership-patch.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dist/harden-release-chain
          fetch-depth: 0
          persist-credentials: true

      - name: Apply preview ownership patch
        run: python3 scripts/apply_preview_ownership_patch.py

      - name: Validate preview helpers and ownership
        run: |
          set -euo pipefail
          python3 -m unittest scripts.test_preview scripts.test_ci_quality
          python3 scripts/ci_quality.py check-product-urls
          python3 scripts/ci_quality.py check-release-metadata
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("website/preview.json").read_text())
          assert manifest["channel"] == "preview"
          assert manifest["assets"] == {}
          assert manifest["builds"] == {}
          assert "ogulcancelik/herdr" not in Path("website/preview.json").read_text()
          PY
          grep -F 'ref: main' .github/workflows/preview.yml
          ! grep -F 'master' .github/workflows/preview.yml
          grep -F '/website/preview.json @OnlineChef' .github/CODEOWNERS
          git diff --check

      - name: Commit validated preview ownership patch
        run: |
          set -euo pipefail
          git rm \
            scripts/apply_preview_ownership_patch.py \
            .github/workflows/apply-preview-ownership-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/CODEOWNERS \
            .github/workflows/preview.yml \
            DOWNSTREAM.md \
            scripts/ci_quality.py \
            scripts/preview.py \
            scripts/test_preview.py \
            website/preview.json
          git diff --cached --check
          git commit -m "security: move preview under downstream ownership"
          git push origin HEAD:dist/harden-release-chain
