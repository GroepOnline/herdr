name: PR 79 structural remediation

on:
  push:
    branches:
      - freebuff/changes-fx8b6gcy
    paths:
      - .github/workflows/pr79-structural-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: freebuff/changes-fx8b6gcy
          fetch-depth: 0

      - name: Apply structural fixes
        run: |
          python3 .github/pr79_fix_script_anchor.py
          python3 .github/pr79_structural_fixes.py
          python3 .github/pr79_structural_adjust.py
          cargo fmt --all

      - name: Remove temporary files and push
        run: |
          git config user.name OnlineChef
          git config user.email chefadmin@chefgroep.online
          git rm .github/workflows/pr79-structural-fixes.yml
          git rm .github/pr79_structural_fixes.py
          git rm .github/pr79_structural_adjust.py
          git rm .github/pr79_fix_script_anchor.py
          git rm -f src/ui/pr79_ci_trigger.rs || true
          git add src/app/input/mouse.rs src/ui/motion.rs src/ui/shell/mod.rs src/ui/tabs_new/layout.rs src/ui/tabs_new/render.rs
          git commit -m "fix(ui): align new-shell routing and geometry"
          git push origin HEAD:freebuff/changes-fx8b6gcy
