name: Apply Windows Zig cache fix

on:
  push:
    branches:
      - dist/harden-release-chain
    paths:
      - scripts/apply_windows_zig_cache_fix.py
      - .github/workflows/apply-windows-zig-cache-fix.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: dist/harden-release-chain
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic Windows cache patch
        run: python3 scripts/apply_windows_zig_cache_fix.py

      - name: Validate workflow diff
        run: |
          set -euo pipefail
          grep -A8 -F 'name: Install Zig' .github/workflows/ci.yml | grep -F 'use-cache: false'
          grep -F 'name: Remove Zig build outputs' .github/workflows/ci.yml
          git diff --check

      - name: Commit validated cache fix
        run: |
          set -euo pipefail
          git rm -f \
            scripts/apply_windows_zig_cache_fix.py \
            .github/workflows/apply-windows-zig-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci: disable fragile Windows Zig cache reuse"
          git push origin HEAD:dist/harden-release-chain
