name: PR 79 runtime integration

on:
  push:
    branches:
      - freebuff/changes-fx8b6gcy
    paths:
      - .github/workflows/pr79-runtime-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: freebuff/changes-fx8b6gcy
          fetch-depth: 0

      - name: Integrate terminal surface and animation wakeups
        run: |
          python3 .github/pr79_runtime_integration.py
          cargo fmt --all

      - name: Remove temporary files and push
        run: |
          git config user.name OnlineChef
          git config user.email chefadmin@chefgroep.online
          git rm .github/workflows/pr79-runtime-integration.yml
          git rm .github/pr79_runtime_integration.py
          git rm -f src/ui/pr79_ci_trigger.rs || true
          git add src/ui/shell/mod.rs src/ui/shell/integration_tests.rs src/app/runtime.rs
          git commit -m "fix(ui): integrate terminal rendering and motion wakeups"
          git push origin HEAD:freebuff/changes-fx8b6gcy
