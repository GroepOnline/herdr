name: Approve Merged Contributor

on:
  pull_request_target:
    types: [closed]

jobs:
  approve:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    concurrency:
      group: approve-merged-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Evaluate merged contributor approval
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            const approvedFile = '.github/APPROVED_CONTRIBUTORS';

            if (prAuthor.endsWith('[bot]') || prAuthor === 'dependabot[bot]') {
              core.setOutput('status', 'skipped');
              return;
            }

            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: approvedFile,
              ref: context.payload.repository.default_branch,
            });
            if (Array.isArray(file) || !('content' in file)) throw new Error(`${approvedFile} is not a file`);
            const approvedList = Buffer.from(file.content, file.encoding)
              .toString('utf8')
              .split('\n')
              .map((line) => line.trim().toLowerCase())
              .filter((line) => line && !line.startsWith('#'));
            if (approvedList.includes(prAuthor.toLowerCase())) {
              core.setOutput('status', 'already');
              return;
            }

            core.setOutput('approved_user', prAuthor);
            core.setOutput('status', 'added');

      - name: Create or recover approval proposal
        if: steps.update.outputs.status == 'added'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const approvedUser = '${{ steps.update.outputs.approved_user }}';
            const approvedFile = '.github/APPROVED_CONTRIBUTORS';
            const defaultBranch = context.payload.repository.default_branch;
            const branch = `automation/approve-merged-${{ github.event.pull_request.number }}`;
            const head = `${context.repo.owner}:${branch}`;
            const normalizedUser = approvedUser.toLowerCase();
            const hasApprovedUser = (content) => content
              .split('\n')
              .map((line) => line.trim().toLowerCase())
              .some((line) => line === normalizedUser);
            const getFile = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: approvedFile,
                ref,
              });
              if (Array.isArray(data) || !('content' in data)) throw new Error(`${approvedFile} is not a file`);
              return {
                content: Buffer.from(data.content, data.encoding).toString('utf8'),
                sha: data.sha,
              };
            };

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              const { data: base } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${defaultBranch}`,
              });
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: base.object.sha,
              });
            }

            const proposalFile = await getFile(branch);
            if (!hasApprovedUser(proposalFile.content)) {
              const nextContent = proposalFile.content.trimEnd() + `\n${approvedUser}\n`;
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: approvedFile,
                branch,
                sha: proposalFile.sha,
                message: `chore: propose merged contributor approval for ${approvedUser}`,
                content: Buffer.from(nextContent, 'utf8').toString('base64'),
              });
            }

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              state: 'open',
              per_page: 1,
            });
            if (existing.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: defaultBranch,
                head: branch,
                title: `chore: approve merged contributor ${approvedUser}`,
                body: `Automated proposal to add @${approvedUser} to the approved contributors list after PR #${{ github.event.pull_request.number }} merged.`,
              });
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: branch,
            });
