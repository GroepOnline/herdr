name: Approve Merged Contributor

on:
  pull_request_target:
    types: [closed]

jobs:
  approve:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Persist credentials so the bot can push its short-lived proposal branch.
          persist-credentials: true

      - name: Add merged contributor to approved list
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const prAuthor = context.payload.pull_request.user.login;
            const approvedFile = '.github/APPROVED_CONTRIBUTORS';

            if (prAuthor.endsWith('[bot]') || prAuthor === 'dependabot[bot]') {
              console.log(`Skipping bot: ${prAuthor}`);
              core.setOutput('status', 'skipped');
              return;
            }

            let content = fs.readFileSync(approvedFile, 'utf8');
            const approvedList = content
              .split('\n')
              .map(line => line.trim().toLowerCase())
              .filter(line => line && !line.startsWith('#'));

            if (approvedList.includes(prAuthor.toLowerCase())) {
              console.log(`${prAuthor} is already approved`);
              core.setOutput('status', 'already');
              return;
            }

            content = content.trimEnd() + '\n' + prAuthor + '\n';
            fs.writeFileSync(approvedFile, content);

            console.log(`Added ${prAuthor} to approved contributors`);
            core.setOutput('status', 'added');

      - name: Commit and open approval pull request
        if: steps.update.outputs.status == 'added'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/approve-merged-${{ github.event.pull_request.number }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Approval proposal branch already exists: $branch"
            exit 0
          fi
          git config user.name "kangal-bot"
          git config user.email "285672167+kangal-bot@users.noreply.github.com"
          git add .github/APPROVED_CONTRIBUTORS
          git diff --staged --quiet && exit 0
          git checkout -b "$branch"
          git commit -m "chore: propose merged contributor approval for ${{ github.event.pull_request.user.login }}"
          git push origin "HEAD:$branch"
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: approve merged contributor ${{ github.event.pull_request.user.login }}" \
            --body "Automated proposal to add @${{ github.event.pull_request.user.login }} to the approved contributors list after PR #${{ github.event.pull_request.number }} merged."
